    <!-- Fonts (P7 L262/L263).

         This comment used to read "Webfonts: NOT LOADED, deliberately" and argue that
         removing the CDN cost nothing because the token stack was system-first. Two of
         those claims did not survive checking:

         - It described 4cce4e4 as the commit that removed the fonts. It was not.
           4cce4e4 changed one file, a measurement script. The removal actually
           happened in 19e987e, a .gitignore commit, 77 seconds earlier.
         - The before/after figures quoted there (860.7 -> 567 kB transfer, LCP
           6.47s -> 5.40s, 258.1 kB of fonts) appear nowhere in any tracked file.
           They exist only in a commit message, and the transfer arithmetic does not
           reconcile with the commit's own 291.1 kB figure: 860.7 - 291.1 = 569.6.

         What IS true: the cdnfonts.com stylesheets are gone, no font file existed
         anywhere in the repo until now, and P7's "no third-party font CDN" rule holds.

         What was NOT true: that this cost nothing visually. On Windows and Android the
         removed sheets included Inter and JetBrains Mono, which were the rendering face
         there. Those users did change, and they were pushed onto whatever the OS
         happened to have.

         Now, per P7 L262 ("Inter, variable, self-hosted, Latin subset is the
         cross-platform fallback"), Inter is self-hosted from our own origin:
         @fontsource-variable/inter, latin subset only, 47.1 kB, variable so the type
         scale's 400/500/600/700 weights are real rather than synthesised. No third-party
         origin, so verify-web-vitals-budget.cjs still passes.

         The preload below exists because P7 L263 asks for it, and because a font
         discovered from CSS is discovered late -- it competes with the JS that must land
         before React mounts. Its href is content-hashed by the build, so it must be
         regenerated when the font changes.

         Apple pays nothing: -apple-system matches first, so SF renders natively and this
         file is never fetched there.
         -->
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function() {});
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
