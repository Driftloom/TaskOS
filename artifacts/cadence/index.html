    <!-- Webfonts: NOT LOADED, deliberately. Removed rather than made non-blocking.

         Measured with Lighthouse 13.5.0 on a production build, mobile emulation,
         simulated 1474 kbps: these three stylesheets cost 291.1 kB across three
         extra origins -- 33.8% of total first-load transfer. cdnfonts.com serves
         UNSUBSETTED .woff (not woff2, not subset), roughly 86 kB per file. At
         1474 kbps that steals ~1.6s of link time from a window in which only
         ~0.97s is needed for the 179.6 kB of JS that must land before React can
         mount at all.

         This is the largest single lever on LCP, which measured 6.47s against a
         2.5s threshold.

         Removing them costs nothing visually. The token stack is system-first
         (P7 L262), so it resolves to San Francisco natively on Apple devices
         with zero bytes shipped -- SF Pro is not licensed for web embedding,
         which is exactly why no @font-face is needed:
           --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                        "SF Pro Display", "Inter", "Segoe UI", Roboto,
                        "Noto Sans Tamil", ..., system-ui, sans-serif
         Non-Apple platforms resolve their own UI font, which is also what P7
         describes. A THIRD ordering of this stack was being hand-copied into
         App.tsx and offline.html while it drifted out of sync; both now read
         from the token, so the stack has one source of truth.

         P26 line 1046 recorded "Webfont bytes on first load: 0 -- MET already,
         there is no @font-face and no font CDN". That was false from the start,
         and an earlier pass "fixed" it by moving the @import into HTML <link>,
         which blocks identically. Both the relocation and the removal are now
         undone for real. See scripts/verify-web-vitals-budget.cjs, which fails the
         build on any render-blocking third-party stylesheet. -->
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function() {});
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
