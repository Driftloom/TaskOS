openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - clerkSession: []
tags:
  - name: health
    description: Health operations
  - name: tasks
    description: Personal task operations
  - name: projects
    description: Task project operations
  - name: tags
    description: Task tag operations
  - name: files
    description: Task file-link operations
  - name: calendar
    description: Calendar time-block operations
  - name: reminders
    description: Reminder operations
  - name: notifications
    description: Notification preference operations
  - name: focus
    description: Focus preference and momentum operations
  - name: reschedule
    description: Reschedule engine operations
  - name: memory
    description: Agent memory transparency operations
  - name: rituals
    description: Guided daily ritual operations
  - name: agent
    description: Conversational agent operations
  - name: integrations
    description: Messaging and monitoring integration operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Return tasks scheduled for this local calendar date.
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [today, inbox, all, completed7d]
            default: today
          description: >-
            today = due within the local date; inbox = status 'inbox';
            all = no filter; completed7d = finished in the last 7 days, ordered
            by real completion time (requires tasks.completed_at).
        - name: timezone
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: IANA timezone used to interpret the local calendar date.
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Task deleted
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{id}:
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      description: Tasks in the project survive, unfiled (project_id SET NULL).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Project deleted
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tags:
    get:
      operationId: listTags
      tags: [tags]
      summary: List tags
      responses:
        "200":
          description: Tag list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
    post:
      operationId: createTag
      tags: [tags]
      summary: Find or create a tag
      description: Names are normalized (trim + lowercase). An existing tag with the same name returns 200 with that tag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagInput"
      responses:
        "200":
          description: Existing or new tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          description: Invalid tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tags/{id}:
    delete:
      operationId: deleteTag
      tags: [tags]
      summary: Delete a tag
      description: Removes the tag from all tasks (link rows cascade).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Tag deleted
        "404":
          description: Time block not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reschedule/proposals:
    get:
      operationId: listRescheduleProposals
      tags: [reschedule]
      summary: List pending reschedule proposals
      responses:
        "200":
          description: Proposal list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RescheduleProposal"
  /reschedule/proposals/{id}/accept:
    post:
      operationId: acceptRescheduleProposal
      tags: [reschedule]
      summary: Accept a proposal and move the task
      description: Applies the move when the task is still open and under the cap; otherwise expires the proposal with 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Accepted proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleProposal"
        "400":
          description: Proposal no longer applicable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proposal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reschedule/proposals/{id}/decline:
    post:
      operationId: declineRescheduleProposal
      tags: [reschedule]
      summary: Decline a proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Declined proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleProposal"
        "404":
          description: Proposal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /settings/rescheduling:
    get:
      operationId: getRescheduleSettings
      tags: [reschedule]
      summary: Read reschedule preferences
      description: Auto-creates defaults (ask, cap 3) on first read.
      responses:
        "200":
          description: Reschedule preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleSettings"
    patch:
      operationId: updateRescheduleSettings
      tags: [reschedule]
      summary: Update reschedule preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleSettingsUpdate"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleSettings"
        "400":
          description: Invalid preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tasks/{id}/files:
    get:
      operationId: listTaskFiles
      tags: [files]
      summary: List a task's file links
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: File link list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileLink"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createTaskFile
      tags: [files]
      summary: Attach a file link to a task
      description: Links only — the URL must be http(s); no uploads.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileLinkInput"
      responses:
        "201":
          description: Attached file link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileLink"
        "400":
          description: Invalid file link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /files/{id}:
    delete:
      operationId: deleteTaskFile
      tags: [files]
      summary: Remove a file link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: File link removed
        "404":
          description: File link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /blocks:
    get:
      operationId: listBlocks
      tags: [calendar]
      summary: List time blocks overlapping a day or range
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Range start day (defaults to today in `timezone`).
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Range end day inclusive. Omitted means `date` itself; earlier than `date` is rejected with 400.
        - name: timezone
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: IANA timezone used to interpret the days.
      responses:
        "200":
          description: Time block list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeBlock"
  /tasks/{id}/blocks:
    get:
      operationId: listTaskBlocks
      tags: [calendar]
      summary: List a task's time blocks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Time block list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeBlock"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createTaskBlock
      tags: [calendar]
      summary: Place a block for a task
      description: Blocks never move tasks.dueAt. Overlapping blocks are rejected with 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeBlockInput"
      responses:
        "201":
          description: Created time block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeBlock"
        "400":
          description: Invalid or overlapping block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /blocks/{id}:
    patch:
      operationId: updateTaskBlock
      tags: [calendar]
      summary: Move or resize a time block
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeBlockUpdate"
      responses:
        "200":
          description: Updated time block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeBlock"
        "400":
          description: Invalid or overlapping block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Time block not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTaskBlock
      tags: [calendar]
      summary: Remove a time block
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Time block removed
        "404":
          description: Time block not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tasks/{id}/reminders:
    get:
      operationId: listTaskReminders
      tags: [reminders]
      summary: List a task's reminders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reminder list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createTaskReminder
      tags: [reminders]
      summary: Add a reminder to a task
      description: Past times are allowed — they fire on the next dispatch.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderInput"
      responses:
        "201":
          description: Created reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "400":
          description: Invalid reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tasks/{id}/reminders/auto:
    post:
      operationId: createAutoReminders
      tags: [reminders]
      summary: Create the standard tier set for a task
      description: Creates T-1 day, T-1 hour and at-time reminders from the given (or the task's) due date. Tiers already past are skipped; existing rows are never duplicated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderAutoInput"
      responses:
        "200":
          description: Tier reminders (created or already present)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reminders/{id}:
    patch:
      operationId: updateReminder
      tags: [reminders]
      summary: Reschedule or cancel a reminder
      description: >-
        Sent reminders are immutable. status canceled cancels a pending
        reminder.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderUpdate"
      responses:
        "200":
          description: Updated reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "400":
          description: Invalid reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Reminder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteReminder
      tags: [reminders]
      summary: Delete a reminder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Reminder deleted
        "404":
          description: Reminder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /settings/notifications:
    get:
      operationId: getNotificationSettings
      tags: [notifications]
      summary: Read notification preferences
      description: Auto-creates defaults on first read.
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
    patch:
      operationId: updateNotificationSettings
      tags: [notifications]
      summary: Update notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettingsUpdate"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "400":
          description: Invalid preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /settings/focus:
    get:
      operationId: getFocusSettings
      tags: [focus]
      summary: Read focus preferences
      description: Auto-creates defaults on first read.
      responses:
        "200":
          description: Focus preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSettings"
    patch:
      operationId: updateFocusSettings
      tags: [focus]
      summary: Update focus preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSettingsUpdate"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSettings"
        "400":
          description: Invalid preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /momentum:
    get:
      operationId: getMomentum
      tags: [focus]
      summary: Momentum snapshot for Activity Rings
      description: Tasks due that day, completed focus rounds that day, the daily round target, and the current focus streak (consecutive days ending today or yesterday with at least one completed round).
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: timezone
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Momentum snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Momentum"
  /tasks/summary:
    get:
      operationId: getTaskSummary
      tags: [tasks]
      summary: Get daily task summary
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: timezone
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: IANA timezone used to interpret the local calendar date.
      responses:
        "200":
          description: Daily task summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSummary"
  /focus-sessions:
    get:
      operationId: listFocusSessions
      tags: [focus]
      summary: List focus sessions
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: timezone
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Focus sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FocusSession"
    post:
      operationId: createFocusSession
      tags: [focus]
      summary: Start a focus session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionInput"
      responses:
        "201":
          description: Started focus session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /focus-sessions/{id}:
    patch:
      operationId: updateFocusSession
      tags: [focus]
      summary: Update a focus session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionUpdate"
      responses:
        "200":
          description: Updated focus session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
        "404":
          description: Focus session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /memory/facts:
    get:
      operationId: listMemoryFacts
      tags: [memory]
      summary: List memory facts
      description: >
        What Cadence believes about the user, with provenance. Returns an empty
        array (never a placeholder) when nothing has been learned yet, so a
        fresh account renders an honest empty state.
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [procrastination, channel, soft_commitment, hackathon, chronotype, custom]
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Memory facts
          content:
            application/json:
              schema:
                type: object
                required: [facts]
                properties:
                  facts:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemoryFact"
    post:
      operationId: createMemoryFact
      tags: [memory]
      summary: Create a memory fact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryFactInput"
      responses:
        "201":
          description: Created fact
          content:
            application/json:
              schema:
                type: object
                required: [fact]
                properties:
                  fact:
                    $ref: "#/components/schemas/MemoryFact"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /memory/facts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: updateMemoryFact
      tags: [memory]
      summary: Update or archive a memory fact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryFactUpdate"
      responses:
        "200":
          description: Updated fact
          content:
            application/json:
              schema:
                type: object
                required: [fact]
                properties:
                  fact:
                    $ref: "#/components/schemas/MemoryFact"
        "400":
          description: Invalid fact id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Fact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteMemoryFact
      tags: [memory]
      summary: Delete a memory fact
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          description: Invalid fact id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Fact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /memory/confirmations:
    get:
      operationId: listMemoryConfirmations
      tags: [memory]
      summary: List inferences awaiting user confirmation
      description: >
        Source B (conversational) facts always require explicit confirmation
        before they are trusted. Source A (behavioral) facts never appear here.
      responses:
        "200":
          description: Pending confirmations
          content:
            application/json:
              schema:
                type: object
                required: [confirmations]
                properties:
                  confirmations:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemoryFact"
  /memory/confirmations/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: approveMemoryConfirmation
      tags: [memory]
      summary: Approve a pending inference
      responses:
        "200":
          description: Approved fact
          content:
            application/json:
              schema:
                type: object
                required: [fact]
                properties:
                  fact:
                    $ref: "#/components/schemas/MemoryFact"
        "400":
          description: Invalid confirmation id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Confirmation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /memory/confirmations/{id}/decline:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: declineMemoryConfirmation
      tags: [memory]
      summary: Decline a pending inference
      responses:
        "200":
          description: Declined (archived) fact
          content:
            application/json:
              schema:
                type: object
                required: [fact]
                properties:
                  fact:
                    $ref: "#/components/schemas/MemoryFact"
        "400":
          description: Invalid confirmation id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Confirmation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rituals/plan-day:
    get:
      operationId: planDay
      tags: [rituals]
      summary: Build the morning plan for a day
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: timezone
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Day plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayPlan"
  /rituals/close-day:
    post:
      operationId: closeDay
      tags: [rituals]
      summary: Close the day and optionally roll unfinished work forward
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseDayInput"
      responses:
        "200":
          description: Day summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayCloseSummary"
  /tasks/recurring:
    post:
      operationId: createRecurringTask
      tags: [rituals]
      summary: Materialize a recurring task across a 60-day rolling window
      description: >
        Expands the RRULE into concrete tasks and stores the rule on a template
        row so the nightly recurrence sweep can keep extending the window.
        Re-running is idempotent: existing (user, title, dueAt) rows are kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringTaskInput"
      responses:
        "201":
          description: Materialized tasks
          content:
            application/json:
              schema:
                type: object
                required: [createdCount, templateId, tasks]
                properties:
                  createdCount:
                    type: integer
                  templateId:
                    type: integer
                    nullable: true
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agent/chat:
    post:
      operationId: agentChat
      tags: [agent]
      summary: Send a message to the agent
      description: >
        Every tool the agent calls is recorded in agent_action_log with enough
        state to reverse it. Bulk actions touching more than 10 tasks require an
        explicit confirmation before they are applied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentChatInput"
      responses:
        "200":
          description: Agent reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentChatOutput"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agent/undo:
    post:
      operationId: agentUndo
      tags: [agent]
      summary: Undo the last agent action
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUndoInput"
      responses:
        "200":
          description: Undo result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentUndoOutput"
        "400":
          description: Nothing to undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agent/actions:
    get:
      operationId: listAgentActions
      tags: [agent]
      summary: List recent agent actions
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Action log
          content:
            application/json:
              schema:
                type: object
                required: [actions]
                properties:
                  actions:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentAction"
  /agent/usage:
    get:
      operationId: getAgentUsage
      tags: [agent]
      summary: Month-to-date LLM usage and spend
      responses:
        "200":
          description: Usage summary
          content:
            application/json:
              schema:
                type: object
                required: [usage]
                properties:
                  usage:
                    $ref: "#/components/schemas/AgentUsage"
  /integrations/status:
    get:
      operationId: getIntegrationsStatus
      tags: [integrations]
      summary: Live status of Telegram and the monitoring watchdog
      responses:
        "200":
          description: Integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationsStatus"
  /integrations/telegram/connect:
    post:
      operationId: connectTelegram
      tags: [integrations]
      summary: Connect a Telegram bot and register its webhook
      description: >
        Fails closed with 503 when TELEGRAM_WEBHOOK_SECRET is unset on the
        server, rather than registering the webhook with a guessable secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramConnectInput"
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema:
                type: object
                required: [ok, botUsername, webhookUrl, message]
                properties:
                  ok:
                    type: boolean
                  botUsername:
                    type: string
                  botName:
                    type: string
                    nullable: true
                  webhookUrl:
                    type: string
                  message:
                    type: string
        "400":
          description: Telegram rejected the token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Telegram setWebhook failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: TELEGRAM_WEBHOOK_SECRET is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /integrations/telegram/test-message:
    post:
      operationId: sendTelegramTestMessage
      tags: [integrations]
      summary: Send a test nudge to the linked Telegram chat
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        "400":
          description: Bot or chat id not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Telegram send failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /integrations/telegram/pairing-token:
    get:
      operationId: getTelegramPairingToken
      tags: [integrations]
      summary: Create a short-lived Telegram pairing link
      description: >
        Returns 400 when no bot is configured. It never invents a bot username,
        because a fabricated handle would render as a real, clickable account.
      responses:
        "200":
          description: Pairing link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingToken"
        "400":
          description: No Telegram bot configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /integrations/telegram/pairing-status:
    get:
      operationId: getTelegramPairingStatus
      tags: [integrations]
      summary: Poll an active pairing session
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pairing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingStatus"
        "400":
          description: Missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /integrations/healthchecks/test:
    post:
      operationId: testHealthcheckPing
      tags: [integrations]
      summary: Ping a watchdog URL and report latency
      description: >
        Only https URLs on healthchecks.io / hc-ping.com are accepted, so this
        cannot be used to probe internal hosts or cloud metadata endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthcheckPingTestInput"
      responses:
        "200":
          description: Ping succeeded
          content:
            application/json:
              schema:
                type: object
                required: [ok, status, latencyMs, message]
                properties:
                  ok:
                    type: boolean
                  status:
                    type: integer
                  latencyMs:
                    type: integer
                  message:
                    type: string
        "400":
          description: Rejected URL or non-2xx response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Network error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /integrations/healthchecks/save:
    post:
      operationId: saveHealthcheckSettings
      tags: [integrations]
      summary: Save the monitoring watchdog URLs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthcheckSettingsInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        "400":
          description: Rejected URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Clerk session token for the signed-in user. Browsers send it via the
        Clerk session cookie through @clerk/express; non-browser clients send
        `Authorization: Bearer <session JWT>`. Every route except GET
        /healthz returns 401 without it.
  schemas:
    HealthStatus:
      type: object
      required:
        - status
        - database
      properties:
        status:
          type: string
          enum: [ok, degraded]
        # "up" only when a real query round-tripped. Previously healthz returned
        # a hardcoded "ok" with no DB contact, so it stayed green while Postgres
        # was unreachable.
        database:
          type: string
          enum: [up, down]
        uptimeSeconds:
          type: number
    Task:
      type: object
      required: [id, title, notes, dueAt, durationMin, priority, status, projectId, tags, parentId, rescheduleCount, needsAttention, automation, completedAt, rrule, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        notes:
          type: ["string", "null"]
        dueAt:
          type: ["string", "null"]
          format: date-time
        durationMin:
          type: integer
          minimum: 5
          maximum: 1440
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [inbox, open, completed]
        projectId:
          type: ["integer", "null"]
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        parentId:
          type: ["integer", "null"]
        rescheduleCount:
          type: integer
        needsAttention:
          type: boolean
        automation:
          type: ["string", "null"]
          enum: [off, ask, auto]
        completedAt:
          type: ["string", "null"]
          format: date-time
          description: Real completion time. Null unless status is 'completed'.
        rrule:
          type: ["string", "null"]
          description: >-
            RRULE for a recurring template, e.g. 'FREQ=DAILY'. Null for
            ordinary tasks and for materialized occurrences.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 240
        notes:
          type: ["string", "null"]
          maxLength: 4000
        dueAt:
          type: ["string", "null"]
          format: date-time
        durationMin:
          type: integer
          minimum: 5
          maximum: 1440
          default: 30
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
        status:
          type: string
          enum: [inbox, open]
          default: open
        projectId:
          type: ["integer", "null"]
          description: >-
            Owning project id. Must belong to the caller (else 404).
            Null or omitted leaves the task unfiled.
        tagIds:
          type: array
          items:
            type: integer
          maxItems: 20
          description: >-
            Tag ids to attach. Every id must belong to the caller (else 404).
        parentId:
          type: ["integer", "null"]
          description: >-
            Parent task id for subtasks. Must belong to the caller (else 404).
            Null or omitted creates a top-level task.
        automation:
          type: ["string", "null"]
          enum: [off, ask, auto]
          description: >-
            Per-task automation dial override. Null or omitted inherits the
            user's rescheduling default mode.
        dueText:
          type: ["string", "null"]
          maxLength: 120
          description: >-
            Natural-language due date ("tomorrow 5pm", "fri", "sep 20 9am").
            Resolved server-side in `timezone` and stored as `dueAt`.
            Explicit `dueAt` and `dueText` are mutually exclusive;
            unparseable text is rejected with 400, never silently dropped.
        timezone:
          type: string
          description: >-
            IANA time-zone identifier used to interpret `dueText`
            (e.g. "Asia/Kolkata"). Invalid or absent values fall back to UTC.
    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 240
        notes:
          type: ["string", "null"]
          maxLength: 4000
        dueAt:
          type: ["string", "null"]
          format: date-time
        durationMin:
          type: integer
          minimum: 5
          maximum: 1440
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [inbox, open, completed]
        projectId:
          type: ["integer", "null"]
          description: >-
            Owning project id (must belong to the caller, else 404).
            Null clears the filing; omitted leaves it unchanged.
        tagIds:
          type: array
          items:
            type: integer
          maxItems: 20
          description: >-
            Tag ids to attach. A present array REPLACES the full set
            (            empty array clears all); omitted or null keeps it.
            Every id must belong to the caller (else 404).
        parentId:
          type: ["integer", "null"]
          description: >-
            Parent task id. Must belong to the caller (else 404); cyclic
            assignments are rejected with 400. Null detaches to top level;
            omitted leaves it unchanged.
        automation:
          type: ["string", "null"]
          enum: [off, ask, auto]
          description: >-
            Per-task dial override. Null clears back to the user's default
            mode; omitted leaves it unchanged.
        dueText:
          type: ["string", "null"]
          maxLength: 120
          description: >-
            Natural-language due date, resolved server-side like on create.
            `null` leaves `dueAt` unchanged (send explicit `dueAt: null` to
            clear it). `dueAt` and `dueText` are mutually exclusive.
        timezone:
          type: string
          description: >-
            IANA time-zone identifier used to interpret `dueText`.
            Invalid or absent values fall back to UTC.
    Project:
      type: object
      required: [id, name, color, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        color:
          type: ["string", "null"]
          pattern: '^#[0-9A-Fa-f]{6}$'
    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        color:
          type: ["string", "null"]
          pattern: '^#[0-9A-Fa-f]{6}$'
    Tag:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TagInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
    FileLink:
      type: object
      required: [id, taskId, url, name, createdAt]
      properties:
        id:
          type: integer
        taskId:
          type: integer
        url:
          type: string
        name:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
    FileLinkInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^https?://'
        name:
          type: ["string", "null"]
          minLength: 1
          maxLength: 120
    TimeBlock:
      type: object
      required: [id, taskId, taskTitle, startAt, endAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
        taskId:
          type: integer
        taskTitle:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TimeBlockInput:
      type: object
      required: [startAt, endAt]
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
    TimeBlockUpdate:
      type: object
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
    Reminder:
      type: object
      required: [id, taskId, remindAt, channel, status, attempts, lastError, sentAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
        taskId:
          type: integer
        remindAt:
          type: string
          format: date-time
        channel:
          type: string
          enum: [telegram]
        status:
          type: string
          enum: [pending, sending, sent, failed, canceled]
        attempts:
          type: integer
        lastError:
          type: ["string", "null"]
        sentAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReminderInput:
      type: object
      required: [remindAt]
      properties:
        remindAt:
          type: string
          format: date-time
        channel:
          type: string
          enum: [telegram]
          default: telegram
    ReminderAutoInput:
      type: object
      properties:
        dueAt:
          type: string
          format: date-time
          description: Due date to derive tiers from. Defaults to the task's own dueAt (400 when neither exists).
    ReminderUpdate:
      type: object
      properties:
        remindAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [canceled]
          description: Only `canceled` is accepted; sent reminders are immutable.
    NotificationSettings:
      type: object
      required: [telegramChatId, quietStart, quietEnd, timezone, remindersEnabled, flexible24h, workStart, workEnd, createdAt, updatedAt]
      properties:
        telegramChatId:
          type: ["string", "null"]
        quietStart:
          type: integer
          minimum: 0
          maximum: 23
        quietEnd:
          type: integer
          minimum: 0
          maximum: 23
        timezone:
          type: string
        remindersEnabled:
          type: boolean
        flexible24h:
          type: boolean
          description: >-
            True means 24-hour flexibility and workStart/workEnd are ignored.
            False means workStart..workEnd is the schedulable window.
        workStart:
          type: integer
          minimum: 0
          maximum: 23
        workEnd:
          type: integer
          minimum: 0
          maximum: 23
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NotificationSettingsUpdate:
      type: object
      properties:
        telegramChatId:
          type: ["string", "null"]
          pattern: '^-?[0-9]{1,19}$'
          description: Numeric Telegram chat id as text. Null unlinks.
        quietStart:
          type: integer
          minimum: 0
          maximum: 23
        quietEnd:
          type: integer
          minimum: 0
          maximum: 23
        timezone:
          type: string
          description: IANA identifier; invalid values are rejected with 400.
        remindersEnabled:
          type: boolean
        flexible24h:
          type: boolean
        workStart:
          type: integer
          minimum: 0
          maximum: 23
        workEnd:
          type: integer
          minimum: 0
          maximum: 23
    FocusSettings:
      type: object
