openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - clerkSession: []
tags:
  - name: health
    description: Health operations
  - name: tasks
    description: Personal task operations
  - name: projects
    description: Task project operations
  - name: tags
    description: Task tag operations
  - name: files
    description: Task file-link operations
  - name: calendar
    description: Calendar time-block operations
  - name: reminders
    description: Reminder operations
  - name: notifications
    description: Notification preference operations
  - name: focus
    description: Focus preference and momentum operations
  - name: reschedule
    description: Reschedule engine operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Return tasks scheduled for this local calendar date.
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [today, inbox, all]
            default: today
        - name: timezone
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: IANA timezone used to interpret the local calendar date.
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Task deleted
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{id}:
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      description: Tasks in the project survive, unfiled (project_id SET NULL).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Project deleted
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tags:
    get:
      operationId: listTags
      tags: [tags]
      summary: List tags
      responses:
        "200":
          description: Tag list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
    post:
      operationId: createTag
      tags: [tags]
      summary: Find or create a tag
      description: Names are normalized (trim + lowercase). An existing tag with the same name returns 200 with that tag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagInput"
      responses:
        "200":
          description: Existing or new tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          description: Invalid tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tags/{id}:
    delete:
      operationId: deleteTag
      tags: [tags]
      summary: Delete a tag
      description: Removes the tag from all tasks (link rows cascade).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Tag deleted
        "404":
          description: Time block not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reschedule/proposals:
    get:
      operationId: listRescheduleProposals
      tags: [reschedule]
      summary: List pending reschedule proposals
      responses:
        "200":
          description: Proposal list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RescheduleProposal"
  /reschedule/proposals/{id}/accept:
    post:
      operationId: acceptRescheduleProposal
      tags: [reschedule]
      summary: Accept a proposal and move the task
      description: Applies the move when the task is still open and under the cap; otherwise expires the proposal with 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Accepted proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleProposal"
        "400":
          description: Proposal no longer applicable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proposal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reschedule/proposals/{id}/decline:
    post:
      operationId: declineRescheduleProposal
      tags: [reschedule]
      summary: Decline a proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Declined proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleProposal"
        "404":
          description: Proposal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /settings/rescheduling:
    get:
      operationId: getRescheduleSettings
      tags: [reschedule]
      summary: Read reschedule preferences
      description: Auto-creates defaults (ask, cap 3) on first read.
      responses:
        "200":
          description: Reschedule preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleSettings"
    patch:
      operationId: updateRescheduleSettings
      tags: [reschedule]
      summary: Update reschedule preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleSettingsUpdate"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleSettings"
        "400":
          description: Invalid preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tasks/{id}/files:
    get:
      operationId: listTaskFiles
      tags: [files]
      summary: List a task's file links
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: File link list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileLink"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createTaskFile
      tags: [files]
      summary: Attach a file link to a task
      description: Links only — the URL must be http(s); no uploads.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileLinkInput"
      responses:
        "201":
          description: Attached file link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileLink"
        "400":
          description: Invalid file link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /files/{id}:
    delete:
      operationId: deleteTaskFile
      tags: [files]
      summary: Remove a file link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: File link removed
        "404":
          description: File link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /blocks:
    get:
      operationId: listBlocks
      tags: [calendar]
      summary: List time blocks overlapping a day or range
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Range start day (defaults to today in `timezone`).
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Range end day inclusive. Omitted means `date` itself; earlier than `date` is rejected with 400.
        - name: timezone
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: IANA timezone used to interpret the days.
      responses:
        "200":
          description: Time block list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeBlock"
  /tasks/{id}/blocks:
    get:
      operationId: listTaskBlocks
      tags: [calendar]
      summary: List a task's time blocks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Time block list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeBlock"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createTaskBlock
      tags: [calendar]
      summary: Place a block for a task
      description: Blocks never move tasks.dueAt. Overlapping blocks are rejected with 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeBlockInput"
      responses:
        "201":
          description: Created time block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeBlock"
        "400":
          description: Invalid or overlapping block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /blocks/{id}:
    patch:
      operationId: updateTaskBlock
      tags: [calendar]
      summary: Move or resize a time block
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeBlockUpdate"
      responses:
        "200":
          description: Updated time block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeBlock"
        "400":
          description: Invalid or overlapping block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Time block not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTaskBlock
      tags: [calendar]
      summary: Remove a time block
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Time block removed
        "404":
          description: Time block not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tasks/{id}/reminders:
    get:
      operationId: listTaskReminders
      tags: [reminders]
      summary: List a task's reminders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reminder list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createTaskReminder
      tags: [reminders]
      summary: Add a reminder to a task
      description: Past times are allowed — they fire on the next dispatch.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderInput"
      responses:
        "201":
          description: Created reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "400":
          description: Invalid reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tasks/{id}/reminders/auto:
    post:
      operationId: createAutoReminders
      tags: [reminders]
      summary: Create the standard tier set for a task
      description: Creates T-1 day, T-1 hour and at-time reminders from the given (or the task's) due date. Tiers already past are skipped; existing rows are never duplicated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderAutoInput"
      responses:
        "200":
          description: Tier reminders (created or already present)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reminders/{id}:
    patch:
      operationId: updateReminder
      tags: [reminders]
      summary: Reschedule or cancel a reminder
      description: >-
        Sent reminders are immutable. status canceled cancels a pending
        reminder.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderUpdate"
      responses:
        "200":
          description: Updated reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "400":
          description: Invalid reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Reminder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteReminder
      tags: [reminders]
      summary: Delete a reminder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Reminder deleted
        "404":
          description: Reminder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /settings/notifications:
    get:
      operationId: getNotificationSettings
      tags: [notifications]
      summary: Read notification preferences
      description: Auto-creates defaults on first read.
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
    patch:
      operationId: updateNotificationSettings
      tags: [notifications]
      summary: Update notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettingsUpdate"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "400":
          description: Invalid preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /settings/focus:
    get:
      operationId: getFocusSettings
      tags: [focus]
      summary: Read focus preferences
      description: Auto-creates defaults on first read.
      responses:
        "200":
          description: Focus preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSettings"
    patch:
      operationId: updateFocusSettings
      tags: [focus]
      summary: Update focus preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSettingsUpdate"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSettings"
        "400":
          description: Invalid preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /momentum:
    get:
      operationId: getMomentum
      tags: [focus]
      summary: Momentum snapshot for Activity Rings
      description: Tasks due that day, completed focus rounds that day, the daily round target, and the current focus streak (consecutive days ending today or yesterday with at least one completed round).
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: timezone
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Momentum snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Momentum"
  /tasks/summary:
    get:
      operationId: getTaskSummary
      tags: [tasks]
      summary: Get daily task summary
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: timezone
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: IANA timezone used to interpret the local calendar date.
      responses:
        "200":
          description: Daily task summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSummary"
  /focus-sessions:
    get:
      operationId: listFocusSessions
      tags: [focus]
      summary: List focus sessions
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: timezone
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Focus sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FocusSession"
    post:
      operationId: createFocusSession
      tags: [focus]
      summary: Start a focus session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionInput"
      responses:
        "201":
          description: Started focus session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /focus-sessions/{id}:
    patch:
      operationId: updateFocusSession
      tags: [focus]
      summary: Update a focus session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionUpdate"
      responses:
        "200":
          description: Updated focus session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
        "404":
          description: Focus session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Clerk session token for the signed-in user. Browsers send it via the
        Clerk session cookie through @clerk/express; non-browser clients send
        `Authorization: Bearer <session JWT>`. Every route except GET
        /healthz returns 401 without it.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Task:
      type: object
      required: [id, title, notes, dueAt, durationMin, priority, status, projectId, tags, parentId, rescheduleCount, needsAttention, automation, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        notes:
          type: ["string", "null"]
        dueAt:
          type: ["string", "null"]
          format: date-time
        durationMin:
          type: integer
          minimum: 5
          maximum: 1440
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [inbox, open, completed]
        projectId:
          type: ["integer", "null"]
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        parentId:
          type: ["integer", "null"]
        rescheduleCount:
          type: integer
        needsAttention:
          type: boolean
        automation:
          type: ["string", "null"]
          enum: [off, ask, auto]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 240
        notes:
          type: ["string", "null"]
          maxLength: 4000
        dueAt:
          type: ["string", "null"]
          format: date-time
        durationMin:
          type: integer
          minimum: 5
          maximum: 1440
          default: 30
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
        status:
          type: string
          enum: [inbox, open]
          default: open
        projectId:
          type: ["integer", "null"]
          description: >-
            Owning project id. Must belong to the caller (else 404).
            Null or omitted leaves the task unfiled.
        tagIds:
          type: array
          items:
            type: integer
          maxItems: 20
          description: >-
            Tag ids to attach. Every id must belong to the caller (else 404).
        parentId:
          type: ["integer", "null"]
          description: >-
            Parent task id for subtasks. Must belong to the caller (else 404).
            Null or omitted creates a top-level task.
        automation:
          type: ["string", "null"]
          enum: [off, ask, auto]
          description: >-
            Per-task automation dial override. Null or omitted inherits the
            user's rescheduling default mode.
        dueText:
          type: ["string", "null"]
          maxLength: 120
          description: >-
            Natural-language due date ("tomorrow 5pm", "fri", "sep 20 9am").
            Resolved server-side in `timezone` and stored as `dueAt`.
            Explicit `dueAt` and `dueText` are mutually exclusive;
            unparseable text is rejected with 400, never silently dropped.
        timezone:
          type: string
          description: >-
            IANA time-zone identifier used to interpret `dueText`
            (e.g. "Asia/Kolkata"). Invalid or absent values fall back to UTC.
    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 240
        notes:
          type: ["string", "null"]
          maxLength: 4000
        dueAt:
          type: ["string", "null"]
          format: date-time
        durationMin:
          type: integer
          minimum: 5
          maximum: 1440
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [inbox, open, completed]
        projectId:
          type: ["integer", "null"]
          description: >-
            Owning project id (must belong to the caller, else 404).
            Null clears the filing; omitted leaves it unchanged.
        tagIds:
          type: array
          items:
            type: integer
          maxItems: 20
          description: >-
            Tag ids to attach. A present array REPLACES the full set
            (            empty array clears all); omitted or null keeps it.
            Every id must belong to the caller (else 404).
        parentId:
          type: ["integer", "null"]
          description: >-
            Parent task id. Must belong to the caller (else 404); cyclic
            assignments are rejected with 400. Null detaches to top level;
            omitted leaves it unchanged.
        automation:
          type: ["string", "null"]
          enum: [off, ask, auto]
          description: >-
            Per-task dial override. Null clears back to the user's default
            mode; omitted leaves it unchanged.
        dueText:
          type: ["string", "null"]
          maxLength: 120
          description: >-
            Natural-language due date, resolved server-side like on create.
            `null` leaves `dueAt` unchanged (send explicit `dueAt: null` to
            clear it). `dueAt` and `dueText` are mutually exclusive.
        timezone:
          type: string
          description: >-
            IANA time-zone identifier used to interpret `dueText`.
            Invalid or absent values fall back to UTC.
